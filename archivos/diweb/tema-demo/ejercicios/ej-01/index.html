<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contador de clics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="contador">
    <h1>Contador</h1>
    <p class="valor" id="valor" aria-live="polite">0</p>
    <div class="botones">
      <button id="restar" type="button">-1</button>
      <button id="sumar" type="button">+1</button>
      <button id="reiniciar" type="button" class="secundario">Reiniciar</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
