
<!DOCTYPE html>

<body>

    <script>
        // Mostramos un mensaje de bienvenida.

        /*
        Este programa muestra
        el mensaje Hola Mundo.
        */
        alert("Hola Mundo");

        // Pedimos una respuesta al usuario.
        var respuesta = prompt("¿Cuántos hijos tienes?");

        Mostramos la respuesta
        introducida por el usuario.
        */
        alert("Tienes " + respuesta + " hijos.");
    </script>
