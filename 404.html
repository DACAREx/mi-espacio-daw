<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Mi espacio DAW</title>
  <meta name="robots" content="noindex">
  <style>
    /* Esta página se sirve desde cualquier ruta inexistente, así que lleva sus estilos incrustados */
    :root { --bg:#f4f5f8; --surface:#fff; --text:#171b22; --muted:#566070; --border:#dde1e8; --accent:#4338ca; --ink:#fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0e1116; --surface:#161a21; --text:#e7eaf0; --muted:#9aa5b4; --border:#29303b; --accent:#9aa2ff; --ink:#0e1116; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem;
      font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
    .box { width:min(32rem,100%); background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:2rem; }
    .code { font:700 3rem/1 ui-monospace,Consolas,monospace; color:var(--accent); margin:0 0 .5rem; }
    h1 { font-size:1.4rem; margin:0 0 .6rem; }
    p { color:var(--muted); margin:0 0 1.4rem; }
    .actions { display:flex; flex-wrap:wrap; gap:.6rem; }
    a.btn { display:inline-block; padding:.6rem 1rem; border-radius:6px; font-weight:600; text-decoration:none;
      border:1px solid var(--border); color:var(--text); }
    a.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--ink); }
    a:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  </style>
</head>
<body>
  <main class="box">
    <p class="code" aria-hidden="true">404</p>
    <h1>No hemos encontrado esta página</h1>
    <p>La dirección no existe o el contenido se ha movido. Vuelve a la portada y entra desde las asignaturas.</p>
    <div class="actions">
      <a class="btn primary" id="home" href="./">Ir a la portada</a>
      <a class="btn" id="search" href="./#/buscar">Buscar contenido</a>
    </div>
  </main>
  <script>
    /* En GitHub Pages de proyecto la web vive en /nombre-repositorio/ y no en la raíz del dominio */
    (function () {
      var base = '/';
      if (/\.github\.io$/.test(location.hostname)) {
        var first = location.pathname.split('/')[1];
        if (first) base = '/' + first + '/';
      }
      document.getElementById('home').href = base;
      document.getElementById('search').href = base + '#/buscar';
    })();
  </script>
</body>
</html>
